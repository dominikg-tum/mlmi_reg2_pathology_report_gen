[project]
name = "mlmi-reg2-pathology-report-gen"
version = "0.1.0"
description = "Agentic pathology report generation from uterine WSIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openai>=1.0",
]
# Install on cluster inside enroot for TITAN/CONCH offline encode (pins from MahmoodLab/TITAN; use container torch)
cluster = [
    "timm==1.0.3",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "transformers==4.46.0",
    "openslide-python>=1.3",
    "tqdm>=4.66",
    "huggingface_hub>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "baselines",
    "eval",
    "extraction",
    "graph",
    "memory",
    "retrieval",
    "training",
    "vision",
]
