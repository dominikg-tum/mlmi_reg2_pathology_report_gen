[project]
name = "mlmi-reg2-pathology-report-gen"
version = "0.1.0"
description = "Agentic pathology report generation from uterine WSIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "openai>=1.0",
]
frontend = [
    "streamlit>=1.32",
    "openai>=1.0",
]
# Install on cluster inside enroot for TITAN/CONCH offline encode (pins from MahmoodLab/TITAN; use container torch)
cluster = [
    "timm==1.0.3",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "transformers==4.46.0",
    "openslide-python>=1.3",
    "tqdm>=4.66",
    "huggingface_hub>=0.23",
]
rag = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.2",
    "langchain-classic>=0.3",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
]
# Phase-1 LoRA fine-tune (training/lora.py). Needs a transformers new enough for
# Qwen3-VL (>=4.57); install fresh in the enroot env — NOT compatible with the
# transformers==4.46 pin used for TITAN/CONCH offline encode.
training = [
    "transformers>=4.57",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "datasets>=3.0",
    "bitsandbytes>=0.44",
    "qwen-vl-utils>=0.0.8",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "baselines",
    "eval",
    "extraction",
    "graph",
    "memory",
    "retrieval",
    "training",
    "vision",
]
