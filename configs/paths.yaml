# Cluster path constants — single source of truth for SLURM scripts and Python.

cluster:
  project_root: /mnt/projects/mlmi/reg2
  data_dir: /mnt/projects/mlmi/reg2/TUMUntera
  labels_xlsx: /mnt/projects/mlmi/reg2/case_reports_to_korea_collaborators.xlsx
  models_dir: /mnt/projects/mlmi/reg2/models
  containers_dir: /mnt/projects/mlmi/reg2/containers
  repos_dir: /mnt/projects/mlmi/reg2/repos
  scripts_dir: /mnt/projects/mlmi/reg2/scripts
  # Legacy team folder — do not clone this repo there
  legacy_repo_dir: /mnt/projects/mlmi/reg2/reg2_repo

user:
  name: dominik
  work_dir: /mnt/projects/mlmi/reg2/dominik
  logs_dir: /mnt/projects/mlmi/reg2/dominik/logs
  cache_dir: /mnt/projects/mlmi/reg2/dominik/cache
  embeddings_dir: /mnt/projects/mlmi/reg2/dominik/embeddings
  enroot_name: dominik_mlmi
  # SLURM / enroot jobs — team base with vLLM + project deps
  container_sqsh: /mnt/projects/mlmi/reg2/containers/qwen25_dev_updated.sqsh
  # Optional: personal export after pip install + testing (dominik_20260529_base.sqsh)
  personal_container_sqsh: /mnt/projects/mlmi/reg2/containers/dominik_20260529_base.sqsh

repo:
  name: mlmi_reg2_pathology_report_gen
  path: /mnt/projects/mlmi/reg2/repos/mlmi_reg2_pathology_report_gen

# Deployed under cluster.models_dir (ls models/)
models:
  qwen3_vl_8b: /mnt/projects/mlmi/reg2/models/Qwen3-VL-8B-Instruct
  qwen3_vl_30b: /mnt/projects/mlmi/reg2/models/Qwen3-VL-30B-A3B-Instruct
  internvl3_5_8b: /mnt/projects/mlmi/reg2/models/InternVL3_5-8B
  internvl3_5_14b: /mnt/projects/mlmi/reg2/models/InternVL3_5-14B
  medgemma_4b: /mnt/projects/mlmi/reg2/models/medgemma-1.5-4b-it
  # HuggingFace id or local mirror; requires HF token + MahmoodLab/TITAN access
  titan: MahmoodLab/TITAN

qwen:
  model_path: /mnt/projects/mlmi/reg2/models/Qwen3-VL-8B-Instruct
  api_base_url: http://localhost:8000/v1
  api_key: token-abc123
  model_name: Qwen3-VL-8B-Instruct

extraction:
  # Repo script output (team root script writes report_parts_extracted.json at project_root)
  report_parts_json: /mnt/projects/mlmi/reg2/repos/mlmi_reg2_pathology_report_gen/data/report_parts_extracted.json
