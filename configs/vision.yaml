# Offline WSI caches — matches cluster user.cache_dir in configs/paths.yaml
cache_root: /mnt/projects/mlmi/reg2/dominik/cache

# ENCODER CONSTRAINT (locked): CONCHv1.5 via MahmoodLab/TITAN return_conch() only.
# Requires paired text encoder for question-conditioned cosine sim retrieval.
# Do NOT switch to UNI2-h (vision-only). No KRONOS/SEAL (wrong modality).
# ABMIL fallback: not implemented — question-blind; see retrieval.abmil_fallback.

thumbnail:
  max_edge_px: 1024
  format: png
  # Team flat JPEG banks (460 slides). Agent reads here first; falls back to cache_root/{slide_id}/thumbnail.png
  dataset_root: /mnt/projects/mlmi/reg2/dataset
  # thumbnails | thumbnails_kmeans | thumbnails_kmeans_5
  variant: thumbnails_kmeans

# Multi-scale tiling: native patch size per zoom → resize to conch_input_px before CONCH encode.
magnification_bands:
  5x:
    objective: 5x
    patch_size: 2048
    conch_input_px: 224
  10x:
    objective: 10x
    patch_size: 1024
    conch_input_px: 224
  20x:
    objective: 20x
    patch_size: 512
    conch_input_px: 224
  40x:
    objective: 40x
    patch_size: 256
    conch_input_px: 224

retrieval:
  # Default: cosine rank over full offline 20x pool. K-means pre-filter is ablation-only.
  fixed_pool: 20x
  search_all_patches: true
  kmeans_k: 100  # used only when search_all_patches: false or --kmeans-pool
  top_k: 5
  top_k_by_zoom:
    5x: 3
    10x: 3
    20x: 5
    40x: 5
  d_min_20x_px: 512
  # CMT-style adjacent-scale context at retrieval (dual images to VLM, no learned fusion).
  adjacent_scale:
    enabled: false
    parent_map:
      40x: 20x
      20x: 10x
      10x: 5x
    grandparent_for_integration: true  # tier=integration or node_kind integration/report
  # CONCH offline: patch embedding pools per WSI (Phase 1 only).
  # 40x omitted for batch run — slow full-slide scan; add back when graph nodes need it.
  encode_levels:
    - 20x
  # abmil_fallback: reserved — only if cosine sim shows systematic failures (not implemented)

# Offline tissue gate — slide-level HSV mask + per-patch tissue fraction (Phase B).
tissue_filter:
  method: slide_mask          # slide_mask | mean_threshold
  mask_source: thumbnail      # thumbnail via openslide get_thumbnail
  min_tissue_fraction: 0.40
  hsv_sat_min: 0.08
  hsv_val_max: 0.95
  morph_close_px: 5
  # Legacy fallback (method: mean_threshold)
  background_threshold: 220

defaults:
  visual: thumbnail
  retriever: none
  navigator: graph_guided

titan:
  model_id: MahmoodLab/TITAN
  # Pinned runtime deps (install in enroot before encode): timm==1.0.3
  # einops==0.6.1 einops-exts==0.0.4 transformers==4.46.0 — use container torch; see load_paths.sh
  # Encode policy: n_tissue <= full_encode_threshold → encode ALL; else stratified grid → max_patches_per_slide
  max_patches_per_slide: 4096
  full_encode_threshold: 1024
  patch_sampling: stratified_grid
  grid_cells: [8, 8]
  batch_size: 16
