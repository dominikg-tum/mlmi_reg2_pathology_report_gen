# Offline WSI caches — matches cluster user.cache_dir in configs/paths.yaml
cache_root: /mnt/projects/mlmi/reg2/dominik/cache

thumbnail:
  max_edge_px: 1024
  format: png

magnification_bands:
  low:
    objective: 5x
    patch_size: 256
  medium:
    objective: 10x
    patch_size: 256
  high:
    objective: 20x
    patch_size: 256

defaults:
  visual: thumbnail
  retriever: none
  navigator: graph_guided

titan:
  model_id: MahmoodLab/TITAN
  max_patches_per_slide: 512
  batch_size: 32
